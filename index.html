<style>
:root{--bg:#f6f8fb;--card:#fff;--tx:#14213d;--mut:#6b7690;--pri:#f97316;--lost:#e11d48;--found:#059669;--bd:#e5e9f2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1524;--card:#18223a;--tx:#eef2fb;--mut:#97a3bf;--bd:#28334f}}
:root[data-theme="dark"]{--bg:#0f1524;--card:#18223a;--tx:#eef2fb;--mut:#97a3bf;--bd:#28334f}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column}
header{padding:14px 18px;font-weight:800;font-size:21px;color:var(--pri)}

nav{display:flex;background:var(--card);border-top:1px solid var(--bd)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mut);font-size:11px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;color:#fff;margin-right:4px}
.lost{background:var(--lost)}.found{background:var(--found)}.st{background:var(--mut)}.event{background:#7c3aed}.info{background:#0284c7}
.btn{background:var(--pri);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;width:100%}
.btn.sec{background:transparent;color:var(--pri);border:1px solid var(--pri)}.btn.sm{width:auto;padding:8px 14px;font-size:14px}.btn.red{background:var(--lost)}
input,textarea,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mut);font-weight:600}.mut{color:var(--mut);font-size:13px}
.row{display:flex;gap:8px;align-items:center}.chips{display:flex;gap:8px;margin:4px 0 12px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:14px}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px 8px;text-align:center;cursor:pointer;font-weight:600}
.tile b{display:block;font-size:30px;font-weight:400;margin-bottom:4px}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;margin:6px 0;background:var(--card);border:1px solid var(--bd);font-size:15px}
.msg.me{background:var(--pri);color:#fff;margin-left:auto;border-color:var(--pri)}
.av{width:84px;height:84px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 10px;overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.login{text-align:center;padding:50px 20px}.login h1{font-size:38px;color:var(--pri);margin-bottom:6px}
.back{background:none;border:0;color:var(--pri);font-size:15px;cursor:pointer;padding:4px 0 12px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:9}
.thumb{width:100%;max-height:200px;object-fit:cover;border-radius:12px;margin-bottom:8px}
.fav{float:right;background:none;border:0;font-size:22px;cursor:pointer;color:var(--lost)}
.banner{background:var(--card);border:1px dashed var(--pri);border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px}
svg text{fill:var(--mut);font-size:9px}

#main>*{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
#main>*:nth-child(2){animation-delay:.05s}#main>*:nth-child(3){animation-delay:.1s}#main>*:nth-child(n+4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.card{border-radius:22px;box-shadow:0 6px 22px rgba(15,23,42,.07);transition:transform .2s,box-shadow .2s}
.card:active{transform:scale(.985)}
.tile{border-radius:20px;box-shadow:0 4px 14px rgba(15,23,42,.06);transition:transform .15s,box-shadow .2s}
.tile:active{transform:scale(.92)}
.chip{border-radius:999px;transition:transform .15s,background .2s}.chip:active{transform:scale(.94)}
.btn{border-radius:16px;box-shadow:0 6px 16px rgba(249,115,22,.28);transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}.btn.sec,.btn.red{box-shadow:none}
.card .btn{margin-top:8px}
nav{border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(15,23,42,.08)}
nav button{position:relative;transition:color .2s}
nav button b{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
nav button.on b{transform:translateY(-3px) scale(1.2)}
nav button.on::after{content:"";position:absolute;bottom:3px;left:50%;width:20px;height:3px;border-radius:3px;background:var(--pri);transform:translateX(-50%)}
.hero{background:linear-gradient(135deg,var(--pri),#fb923c);color:#fff;border-radius:28px;padding:22px 16px;text-align:center;margin-bottom:12px;box-shadow:0 10px 26px rgba(249,115,22,.3)}
.hero h2{margin:6px 0 2px}.hero p{margin:0 0 12px;opacity:.92}
.hero .chip{background:rgba(255,255,255,.22);color:#fff;border:0;display:inline-block}
.hero .av{border:3px solid rgba(255,255,255,.7)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px 4px;text-align:center;font-size:12px;color:var(--mut);box-shadow:0 4px 14px rgba(15,23,42,.05)}
.stat b{display:block;font-size:17px;color:var(--tx);margin-bottom:2px}
.sec-t{font-weight:800;margin-bottom:10px}
.dz{border-color:#fecaca}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><div id="app"><header>📍 Trouvéoh</header><div id="main"></div><nav id="nav"></nav></div>
<script>
var curVille="";var $=function(i){return document.getElementById(i)},db,uid,me,pdoc,boot=Date.now(),tab=0,cur=null,fail=0,pos=null,pimg="",pt="",q="",flt="all",vil="",rad=5,onDel=function(){location.reload()};

function sim(i){var r=S.items.filter(function(o){return o.id!=i.id&&o.type!=i.type&&o.st!="returned"&&ov(i,o)});return r.length?'<div class="card"><b>🔎 Annonces qui pourraient correspondre</b><p class="mut">À confirmer vous-même avec l’autre personne.</p>'+r.map(function(o){return '<p style="margin-top:6px;cursor:pointer;color:var(--pri)" onclick="cur=\''+o.id+'\';draw()">'+(o.type=="lost"?"Perdu":"Trouvé")+' : '+esc(o.title)+' · '+esc(o.ville)+'</p>'}).join("")+'</div>':""}
function shrink(f,max,cb){var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.7))};im.src=r.result};r.readAsDataURL(f)}

function ref(){if(typeof ed!="undefined"&&ed&&cur!==null)return;var a=document.activeElement,id=a&&a.id,v=a&&a.value;draw();if(id){var e=$(id);if(e&&v!==undefined){e.value=v;e.focus()}}}

function applyTheme(){var t;try{t=localStorage.getItem("tv")}catch(e){}var r=document.documentElement;if(t=="light"||t=="dark")r.setAttribute("data-theme",t);else r.removeAttribute("data-theme")}
function draw(){
 var m=$("main"),n=$("nav");applyTheme();
 if(fail){n.style.display="none";m.innerHTML='<div class="login"><h1>Trouvéoh</h1><p class="mut">Connexion impossible ou accès refusé. Vérifiez votre connexion et vos droits d’accès.</p></div>';return}
 if(!db||!S.r1||(uid&&!S.r2)){n.style.display="none";m.innerHTML='<div class="login"><h1>Trouvéoh</h1><p class="mut">Chargement…</p></div>';return}
 if(uid&&!S.dir[uid]){n.style.display="none";m.innerHTML='<div class="login"><h1>Bienvenue</h1><p class="mut" style="margin-bottom:20px">Choisissez le nom affiché aux autres.</p><div class="card" style="text-align:left"><label>Nom</label><input id="on" value="'+esc(me&&me.name||"")+'"><label>Ville</label><input id="ov" placeholder="Ex. : Abidjan"><button class="btn" onclick="onb()">Commencer</button></div></div>';return}
 n.style.display="flex";
 n.innerHTML=NAV.map(function(x,i){return '<button class="'+(i==tab?"on":"")+'" onclick="go('+i+')"><b>'+x[0]+'</b>'+x[1]+'</button>'}).join("");
 var b=!uid&&typeof gsign=="function"?'<div class="banner">Mode invité : lecture seule. <a href="#" onclick="gsign();return false" style="color:var(--pri);font-weight:700">Se connecter avec Google</a></div>':"";
 [home,pub,map,msgs,jeux,prof][tab](m);if(b&&tab<4&&cur===null)m.insertAdjacentHTML("afterbegin",b);
}
function onb(){var v=$("on").value.trim();if(!v){toast("Entrez un nom.");return}S.pr.ville=$("ov").value.trim();sp();var o={name:v,photo:"",ville:S.pr.ville};db.doc("directory/"+uid).set(o).then(function(){S.dir[uid]=o;S.r1=1;ref()},function(e){toast("Enregistrement impossible : "+((e&&e.message)||e))})}
var TN={lost:"Perdu",found:"Trouvé",event:"Événement",info:"Renseignement"},HF=[["all","Tous"],["found","Trouvés"],["lost","Perdus"],["event","Events"],["info","Renseignements"]],ed=0;
function allp(){var b=S.pr.blocked;return S.items.map(function(i){return Object.assign({},i,{_c:"items"})}).concat(S.ev.map(function(e){return Object.assign({},e,{_c:"events",type:"event"})})).concat(S.inf.map(function(e){return Object.assign({},e,{_c:"infos",type:"info"})})).filter(function(x){return b.indexOf(x.aid)<0}).sort(function(a,c){return sps(c)-sps(a)||(c.ts||0)-(a.ts||0)})}
function card(i){var f=S.pr.favs.indexOf(i.id)>=0,n=S.cm.filter(function(c){return c.iid==i.id}).length,it=!i._c||i._c=="items";return '<div class="card" onclick="cur=\''+i.id+'\';ed=0;draw()" style="cursor:pointer"><button class="fav" onclick="event.stopPropagation();fv(\''+i.id+'\')">'+(f?"♥":"♡")+'</button>'+(i.img?'<img class="thumb" src="'+i.img+'">':"")+(sps(i)?'<span class="tag found">⭐ Sponsorisé</span>':"")+'<span class="tag '+i.type+'">'+TN[i.type]+'</span>'+(it?'<span class="tag st">'+ST[i.st||"open"]+'</span>':"")+'<h3 style="margin:8px 0 2px">'+esc(i.title)+'</h3><p class="mut">'+esc(i.cat||"")+' · 📍 '+esc(i.ville||"")+(i.date?" · "+esc(i.date):"")+(pos&&i.lat?" · "+dist(pos.lat,pos.lng,i.lat,i.lng).toFixed(1)+" km":"")+' · 💬 '+n+'</p>'+(it?"":'<p style="margin-top:4px">'+esc((i.desc||"").slice(0,90))+'</p>')+'</div>'}

function home(m){
 if(cur!==null)return detail(m);
 var l=allp().filter(function(i){var t=(i.title+" "+i.desc+" "+i.cat+" "+i.ville).toLowerCase();return(flt=="all"||i.type==flt)&&(!vil||(i.ville||"").toLowerCase().indexOf(vil.toLowerCase())>=0)&&(!q||qm(t))});
 m.innerHTML='<input id="sq" placeholder="🔍 Rechercher : portefeuille noir, concert…" value="'+esc(q)+'" oninput="q=this.value;clearTimeout(window.tq);window.tq=setTimeout(ref,300)" style="margin-top:0"><div class="row"><input id="vq" placeholder="🏙️ Ville…" value="'+esc(vil)+'" style="margin:0" onkeydown="if(event.key==\'Enter\')setVil(this.value)"><button class="btn sm" onclick="setVil($(\'vq\').value)">OK</button></div><div class="chips" style="overflow-x:auto;margin:8px 0 0">'+(vil?'<button class="chip on" style="flex:none" onclick="setVil(\'\')">✕ '+esc(vil)+'</button>':"")+hist().map(function(h){return '<button class="chip" style="flex:none;white-space:nowrap" data-v="'+esc(h)+'" onclick="setVil(this.dataset.v)">🕘 '+esc(h)+'</button>'}).join("")+'</div><div class="chips" style="position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;margin:6px 0 8px;overflow-x:auto;box-shadow:0 3px 6px -4px rgba(0,0,0,.25)">'+HF.map(function(c){return '<button class="chip '+(flt==c[0]?"on":"")+'" style="flex:none" onclick="flt=\''+c[0]+'\';draw()">'+c[1]+'</button>'}).join("")+'</div>'+(l.length?l.map(card).join(""):'<div class="card" style="text-align:center"><p>Rien à afficher pour le moment.</p><p class="mut">Publiez avec l’onglet ➕.</p></div>')}

 m.innerHTML=hd+'<div class="card">'+(sps(i)?'<span class="tag found">⭐ Sponsorisé</span>':"")+'<span class="tag '+i.type+'">'+TN[i.type]+'</span>'+(it?'<span class="tag st">'+ST[i.st||"open"]+'</span>':"")+'<h2 style="margin:8px 0">'+esc(i.title)+'</h2>'+(i.img?'<img class="thumb" src="'+i.img+'">':"")+'<p>'+esc(i.desc||"")+'</p><p class="mut" style="margin:8px 0">'+esc(i.cat||"")+' · 📍 '+esc(i.ville||"")+(it?" (position approximative)":"")+(i.date?" · "+esc(i.date):"")+' · par '+esc(nm(i.aid))+'</p><div class="row"><a href="'+mp+'" target="_blank" rel="noopener" style="flex:1"><button class="btn sec sm" style="width:100%">🗺️ Carte</button></a>'+(i.tel?'<a href="tel:'+esc(i.tel)+'" style="flex:1"><button class="btn sec sm" style="width:100%">📞 Appeler</button></a>':"")+(mine||!i.aid?"":'<button class="btn sm" style="flex:1" onclick="openPM(\''+i.aid+'\')">✉️ Contacter</button>')+'</div></div>'+

function saveE(c,id){var t=$("et").value.trim();if(!t){toast("Titre obligatoire");return}var u={title:t,desc:$("etd").value.trim(),ville:$("evl").value.trim()};if($("edt"))u.date=$("edt").value;db.doc(c+"/"+id).update(u).then(function(){toast("Modifié ✓");ed=0;draw()},function(){toast("Modification impossible")})}
